<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Listing</title>

  <link rel="stylesheet"
    href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand" href="index.html">IMDB</a>

    <a href="create-movie.html" class="btn btn-light create-movie-btn">
      Create Movie
    </a>
  </div>
</nav>

<div class="container mt-4">
  <div class="row" id="movieList"></div>
</div>

<div class="modal fade" id="movieModal">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Movie Details</h5>

        <button class="close" data-dismiss="modal">
          &times;
        </button>
      </div>

      <div class="modal-body">
        <p><strong>Movie:</strong> <span id="modalMovieTitle"></span></p>
        <p><strong>Description:</strong> <span id="modalMovieDescription" class="movie-modal-plot"></span></p>
        <p><strong>Genre:</strong> <span id="modalMovieGenre"></span></p>
        <p><strong>Producer:</strong> <span id="modalMovieProducer"></span></p>
        <p><strong>Year of Release:</strong> <span id="modalMovieYear"></span></p>
        <p><strong>Actors:</strong> <span id="modalMovieActors"></span></p>
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" data-dismiss="modal">
          Close
        </button>
      </div>

    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>

<script src="script.js"></script>

</body>
</html>
