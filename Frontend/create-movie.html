<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Movie</title>

    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="navbar navbar-dark bg-primary">
      <div class="container">
        <a class="navbar-brand" href="index.html">IMDB</a>
      </div>
    </nav>

    <div class="container mt-5">
      <div class="card shadow">
        <div class="card-body">
          <h2 class="mb-4">Create Movie</h2>

          <form id="movieForm" class="needs-validation" novalidate>
            <div class="form-group">
              <label for="movieName">Movie Name</label>

              <input
                type="text"
                class="form-control"
                id="movieName"
                name="movieName"
                required
              />

              <div class="invalid-feedback">Movie name is required</div>
            </div>

            <div class="form-group">
              <label for="yearInput">Year Of Release</label>

              <input
                id="yearInput"
                name="yearInput"
                type="number"
                class="form-control"
                min="1900"
                max="2100"
                step="1"
                placeholder="Enter release year"
                required
              />

              <div class="invalid-feedback">
                Please enter a valid release year
              </div>
            </div>

            <div class="form-group">
              <label for="actorSelect">Actors</label>
              <div
                class="selection-control person-selection-control d-flex align-items-start"
              >
                <div class="selection-input">
                  <select id="actorSelect" name="actorSelect" class="form-control">
                    <option value="">Select Actor</option>
                    <option value="Tom Cruise">Tom Cruise</option>
                    <option value="Robert Downey Jr">Robert Downey Jr</option>
                    <option value="Leonardo DiCaprio">Leonardo DiCaprio</option>
                  </select>

                  <div id="selectedActors" class="selected-items"></div>
                </div>

                <button
                  type="button"
                  class="btn btn-sm person-modal-btn ml-2"
                  id="addActorBtn"
                  data-toggle="modal"
                  data-target="#personModal"
                  data-person-type="actor"
                >
                  Add Actor
                </button>
              </div>

              <div class="invalid-feedback" id="actorListFeedback">
                Please add at least one actor.
              </div>
            </div>

            <div class="form-group">
              <label for="producerSelect">Producer</label>

              <div class="selection-control d-flex align-items-start">
                <div class="selection-field">
                  <select id="producerSelect" name="producerSelect" class="form-control" required>
                    <option value="">Select Producer</option>
                    <option value="Kevin Feige">Kevin Feige</option>
                    <option value="Emma Thomas">Emma Thomas</option>
                    <option value="James Cameron">James Cameron</option>
                  </select>

                  <div class="invalid-feedback">Please select producer</div>
                </div>

                <button
                  type="button"
                  class="btn btn-sm person-modal-btn ml-2"
                  id="addProducerBtn"
                  data-toggle="modal"
                  data-target="#personModal"
                  data-person-type="producer"
                >
                  Add Producer
                </button>
              </div>
            </div>

            <div class="form-group">
              <label for="genreSelect">Genres</label>
              <div class="selection-control">
                <div class="selection-input">
                  <select id="genreSelect" name="genreSelect" class="form-control">
                    <option value="">Select Genre</option>
                    <option value="Action">Action</option>
                    <option value="Drama">Drama</option>
                    <option value="Sci-Fi">Sci-Fi</option>
                  </select>

                  <div id="selectedGenres" class="selected-items"></div>
                </div>
              </div>

              <div class="invalid-feedback" id="genreListFeedback">
                Please add at least one genre.
              </div>
            </div>

            <div class="form-group">
              <label for="moviePlot">Plot</label>

              <textarea
                id="moviePlot"
                name="moviePlot"
                class="form-control"
                rows="4"
                required
              ></textarea>

              <div class="invalid-feedback">Plot is required</div>
            </div>

            <div class="form-group poster-group">
              <label for="moviePoster">Movie Poster Image</label>
              <div class="poster-upload d-flex align-items-start">
                <input
                  type="file"
                  class="form-control-file"
                  id="moviePoster"
                  name="moviePoster"
                  accept=".jpg,.jpeg,.png,image/jpeg,image/png"
                  required
                />
                <img
                  id="posterPreview"
                  class="poster-preview d-none"
                  alt="Movie poster preview"
                />
              </div>
            </div>

            <button class="btn btn-primary submit-btn" type="submit">
              Submit
            </button>
          </form>
        </div>
      </div>
    </div>

    <div class="modal fade" id="personModal">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="personModalTitle">Person Details</h5>
            <button type="button" class="close" data-dismiss="modal">
              &times;
            </button>
          </div>

          <form id="personForm" class="modal-body needs-validation" novalidate>
            <div class="form-group">
              <label for="personName">Name</label>
              <input
                type="text"
                class="form-control"
                id="personName"
                name="personName"
                required
              />
              <div class="invalid-feedback">Name is required.</div>
            </div>
            <div class="form-group">
              <label for="personDateOfBirth">Date of Birth</label>
              <input
                type="date"
                class="form-control"
                id="personDateOfBirth"
                name="personDateOfBirth"
                required
              />
              <div class="invalid-feedback">Date of birth is required.</div>
            </div>
            <div class="form-group">
              <label for="personBio">Bio</label>
              <textarea
                class="form-control"
                id="personBio"
                name="personBio"
                rows="3"
                required
              ></textarea>
              <div class="invalid-feedback">Bio is required.</div>
            </div>
            <div class="form-group">
              <label for="personGender">Gender</label>
              <select class="form-control" id="personGender" name="personGender" required>
                <option value="">Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
              </select>
              <div class="invalid-feedback">Gender is required.</div>
            </div>
          </form>

          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-dismiss="modal"
            >
              Close
            </button>
            <button type="button" class="btn btn-primary" id="savePerson">
              Save
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>

    <script src="script.js"></script>
  </body>
</html>
