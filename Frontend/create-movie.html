<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Movie</title>

  <link rel="stylesheet"
    href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="index.html">Movie App</a>
  </div>
</nav>

<div class="container mt-5">

  <div class="card shadow">
    <div class="card-body">

      <h2 class="mb-4">Create Movie</h2>

      <form id="movieForm" class="needs-validation" novalidate>

        <div class="form-group">
          <label>Movie Name</label>

          <input
            type="text"
            class="form-control"
            required>

          <div class="invalid-feedback">
            Movie name is required
          </div>
        </div>

        <div class="form-group">
          <label>Year Of Release</label>

          <input
            id="yearInput"
            type="number"
            class="form-control"
            min="1900"
            max="2100"
            step="1"
            placeholder="Enter release year"
            required>

          <div class="invalid-feedback">
            Please enter a valid release year
          </div>
        </div>

        <div class="form-group">
          <label for="actorSelect">Actors</label>

          <select id="actorSelect" class="form-control">
            <option value="">Select Actor</option>
            <option value="Tom Cruise">Tom Cruise</option>
            <option value="Robert Downey Jr">Robert Downey Jr</option>
            <option value="Leonardo DiCaprio">Leonardo DiCaprio</option>
          </select>

          <button
            type="button"
            class="btn btn-secondary mt-2"
            id="addActorBtn">
            Add Actor
          </button>

          <div id="selectedActors" class="mt-2"></div>

          <div class="invalid-feedback" id="actorListFeedback">
            Please add at least one actor.
          </div>

          <input type="hidden" id="actorListInput" name="actors">
        </div>

        <div class="form-group">
          <label>Producer</label>

          <select id="producerSelect" class="form-control" required>
            <option value="">Select Producer</option>
            <option value="Kevin Feige">Kevin Feige</option>
            <option value="Emma Thomas">Emma Thomas</option>
            <option value="James Cameron">James Cameron</option>
          </select>

          <div class="invalid-feedback">
            Please select producer
          </div>
        </div>

        <div class="form-group">
          <label for="genreSelect">Genres</label>

          <select id="genreSelect" class="form-control">
            <option value="">Select Genre</option>
            <option value="Action">Action</option>
            <option value="Drama">Drama</option>
            <option value="Sci-Fi">Sci-Fi</option>
          </select>

          <button
            type="button"
            class="btn btn-secondary mt-2"
            id="addGenreBtn">
            Add Genre
          </button>

          <div id="selectedGenres" class="mt-2"></div>

          <div class="invalid-feedback" id="genreListFeedback">
            Please add at least one genre.
          </div>

          <input type="hidden" id="genreListInput" name="genres">
        </div>

        <div class="form-group">
          <label>Plot</label>

          <textarea
            class="form-control"
            rows="4"
            required></textarea>

          <div class="invalid-feedback">
            Plot is required
          </div>
        </div>

        <button class="btn btn-primary" type="submit">
          Submit
        </button>

      </form>

    </div>
  </div>
</div>


<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>

<script src="script.js"></script>

</body>
</html>
