<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Movie</title>

  <link rel="stylesheet"
    href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="index.html">Movie App</a>
  </div>
</nav>

<div class="container mt-5">

  <div class="card shadow">
    <div class="card-body">

      <h2 class="mb-4">Create Movie</h2>

      <form class="needs-validation" novalidate>

        <div class="form-group">
          <label>Movie Name</label>

          <input
            type="text"
            class="form-control"
            required>

          <div class="invalid-feedback">
            Movie name is required
          </div>
        </div>

        <div class="form-group">
          <label>Year Of Release</label>

          <input
            type="date"
            class="form-control"
            required>

          <div class="invalid-feedback">
            Release date is required
          </div>
        </div>

        <div class="form-group">
          <label>Actor</label>

          <select class="form-control" required>
            <option value="">Select Actor</option>
            <option>Tom Cruise</option>
            <option>Robert Downey Jr</option>
            <option>Leonardo DiCaprio</option>
          </select>

          <div class="invalid-feedback">
            Please select actor
          </div>
        </div>

        <button
          type="button"
          class="btn btn-secondary mb-3"
          data-toggle="modal"
          data-target="#actorModal">

          Add Actor
        </button>

        <div class="form-group">
          <label>Producer</label>

          <select class="form-control" required>
            <option value="">Select Producer</option>
            <option>Kevin Feige</option>
            <option>Emma Thomas</option>
            <option>James Cameron</option>
          </select>

          <div class="invalid-feedback">
            Please select producer
          </div>
        </div>

        <button
          type="button"
          class="btn btn-secondary mb-3"
          data-toggle="modal"
          data-target="#producerModal">

          Add Producer
        </button>

        <div class="form-group">
          <label>Genre</label>

          <select class="form-control" required>
            <option value="">Select Genre</option>
            <option>Action</option>
            <option>Drama</option>
            <option>Sci-Fi</option>
          </select>

          <div class="invalid-feedback">
            Please select genre
          </div>
        </div>

        <div class="form-group">
          <label>Plot</label>

          <textarea
            class="form-control"
            rows="4"
            required></textarea>

          <div class="invalid-feedback">
            Plot is required
          </div>
        </div>

        <button class="btn btn-primary" type="submit">
          Submit
        </button>

      </form>

    </div>
  </div>
</div>

<!-- Actor Modal -->
<div class="modal fade" id="actorModal">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <h5>Add Actor</h5>

        <button class="close" data-dismiss="modal">
          &times;
        </button>
      </div>

      <div class="modal-body">
        <input
          type="text"
          class="form-control"
          placeholder="Enter Actor Name">
      </div>

    </div>
  </div>
</div>

<!-- Producer Modal -->
<div class="modal fade" id="producerModal">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <h5>Add Producer</h5>

        <button class="close" data-dismiss="modal">
          &times;
        </button>
      </div>

      <div class="modal-body">
        <input
          type="text"
          class="form-control"
          placeholder="Enter Producer Name">
      </div>

    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>

<script src="script.js"></script>

</body>
</html>
