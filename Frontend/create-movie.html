<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Movie</title>

  <link rel="stylesheet"
    href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="index.html">Movie App</a>
  </div>
</nav>

<div class="container mt-5">

  <div class="card shadow">
    <div class="card-body">

      <h2 class="mb-4">Create Movie</h2>

      <form id="movieForm" class="needs-validation" novalidate>

        <div class="form-group">
          <label>Movie Name</label>

          <input
            type="text"
            class="form-control"
            required>

          <div class="invalid-feedback">
            Movie name is required
          </div>
        </div>

        <div class="form-group">
          <label>Year Of Release</label>

          <input
            id="yearInput"
            type="number"
            class="form-control"
            min="1900"
            max="2100"
            step="1"
            placeholder="Enter release year"
            required>

          <div class="invalid-feedback">
            Please enter a valid release year
          </div>
        </div>

        <div class="form-group">
          <label for="actorSelect">Actors</label>

          <div class="d-flex align-items-start">
            <select id="actorSelect" class="form-control">
              <option value="">Select Actor</option>
              <option value="Tom Cruise">Tom Cruise</option>
              <option value="Robert Downey Jr">Robert Downey Jr</option>
              <option value="Leonardo DiCaprio">Leonardo DiCaprio</option>
            </select>

            <button
              type="button"
              class="btn btn-outline-secondary btn-sm person-modal-btn ml-2"
              id="addActorBtn"
              data-toggle="modal"
              data-target="#personModal"
              data-person-type="actor">
              Add Actor
            </button>
          </div>

          <div id="selectedActors" class="mt-2"></div>

          <div class="invalid-feedback" id="actorListFeedback">
            Please add at least one actor.
          </div>
        </div>

        <div class="form-group">
          <label>Producer</label>

          <div class="d-flex align-items-start">
            <select id="producerSelect" class="form-control" required>
              <option value="">Select Producer</option>
              <option value="Kevin Feige">Kevin Feige</option>
              <option value="Emma Thomas">Emma Thomas</option>
              <option value="James Cameron">James Cameron</option>
            </select>

            <button
              type="button"
              class="btn btn-outline-secondary btn-sm person-modal-btn ml-2"
              id="addProducerBtn"
              data-toggle="modal"
              data-target="#personModal"
              data-person-type="producer">
              Add Producer
            </button>
          </div>

          <div class="invalid-feedback">
            Please select producer
          </div>
        </div>

        <div class="form-group">
          <label for="genreSelect">Genres</label>

          <select id="genreSelect" class="form-control">
            <option value="">Select Genre</option>
            <option value="Action">Action</option>
            <option value="Drama">Drama</option>
            <option value="Sci-Fi">Sci-Fi</option>
          </select>

          <div id="selectedGenres" class="mt-2"></div>

          <div class="invalid-feedback" id="genreListFeedback">
            Please add at least one genre.
          </div>
        </div>

        <div class="form-group">
          <label>Plot</label>

          <textarea
            class="form-control"
            rows="4"
            required></textarea>

          <div class="invalid-feedback">
            Plot is required
          </div>
        </div>

        <div class="form-group">
          <label for="moviePoster">Movie Poster Image</label>
          <input type="file" class="form-control-file" id="moviePoster">
        </div>

        <button class="btn btn-primary" type="submit">
          Submit
        </button>

      </form>

    </div>
  </div>
</div>

<div class="modal fade" id="personModal">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title" id="personModalTitle">Person Details</h5>
        <button type="button" class="close" data-dismiss="modal">&times;</button>
      </div>

      <div class="modal-body">
        <div class="form-group">
          <label for="personName">Name</label>
          <input type="text" class="form-control" id="personName">
        </div>
        <div class="form-group">
          <label for="personDateOfBirth">Date of Birth</label>
          <input type="date" class="form-control" id="personDateOfBirth">
        </div>
        <div class="form-group">
          <label for="personBio">Bio</label>
          <textarea class="form-control" id="personBio" rows="3"></textarea>
        </div>
        <div class="form-group">
          <label for="personGender">Gender</label>
          <select class="form-control" id="personGender">
            <option value="">Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
          </select>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
        <button type="button" class="btn btn-primary" id="savePerson" data-dismiss="modal">Save</button>
      </div>

    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>

<script src="script.js"></script>

</body>
</html>
